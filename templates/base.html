<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Ember & Oak{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ url_for('index') }}">Ember <span>&amp;</span> Oak</a>
    <nav>
      <a href="{{ url_for('index') }}" class="{{ 'active' if request.endpoint == 'index' }}">Order</a>
      <a href="{{ url_for('reserve') }}" class="{{ 'active' if request.endpoint == 'reserve' }}">Reserve</a>
      {% if session.staff_id %}
        <a href="{{ url_for('dashboard') }}" class="{{ 'active' if request.endpoint == 'dashboard' }}">Kitchen</a>
        <form method="post" action="{{ url_for('logout') }}" class="inline"><button class="link">Log out</button></form>
      {% else %}
        <a href="{{ url_for('dashboard') }}">Staff</a>
      {% endif %}
    </nav>
  </header>
  <main class="{% block main_class %}container{% endblock %}">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">Ember &amp; Oak · Open daily 11:00–22:00 · A demo Flask app</footer>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="{{ url_for('static', filename='common.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
